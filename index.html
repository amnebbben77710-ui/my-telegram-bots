<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>BotHost</title></head><body><header><div><strong>BotHost</strong><span>استضافة Telegram</span></div><a href="/logout">تسجيل الخروج</a></header><main><section class="hero"><div><h1>لوحة التحكم</h1><p>ارفع ملف Python وأدخل التوكن، ثم شغّل البوت.</p></div><div class="badge">24/7*</div></section><section class="card"><h2>إضافة بوت</h2><div class="grid"><label>Bot Token<input id="token" type="password" placeholder="123456:ABC..." autocomplete="off"></label><label>ملف البوت<input id="file" type="file" accept=".py,.txt"></label></div><button onclick="upload()">رفع وتشغيل</button><small>المسموح: .py و .txt — الحد الأقصى 2MB.</small><div id="msg"></div></section><section><div class="section-title"><h2>بوتاتي</h2><button class="ghost" onclick="load()">تحديث</button></div><div id="bots"></div></section></main><dialog id="logs"><div class="dialog-head"><b>Logs</b><button onclick="document.getElementById('logs').close()">×</button></div><pre id="logtext"></pre></dialog><script src="/static/app.js"></script></body></html>
